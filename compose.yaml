version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: payflowhub-postgres
    environment:
      POSTGRES_DB: payflowhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: softwareengenieer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

volumes:
  postgres_data:
